name: taiko-github-profile contribution SVG
description: Generate a contribution Taiko SVG or render a custom TJA without copying Python into your profile repository.
branding:
  icon: music
  color: orange

inputs:
  username:
    description: GitHub username; defaults to the caller repository owner.
    required: false
  github-token:
    description: Token for contribution queries. Publishing uses the caller checkout credentials.
    required: false
    default: ${{ github.token }}
  chart:
    description: Optional custom TJA path inside the caller workspace; skips contribution fetching.
    required: false
  snapshot:
    description: Optional offline dated contribution snapshot inside the caller workspace.
    required: false
  outputs:
    description: Multiline output paths with optional query options; overrides legacy output/format. Publish in a separate workflow step.
    required: false
  variant:
    description: full compact strip or classic decorative layout.
    default: full
  output:
    description: Output file relative to the caller workspace.
    default: dist/taiko.svg
  format:
    description: Legacy single-file format, svg or gif.
    default: svg
  bpm:
    description: BPM for generated charts; custom TJA keeps its own BPM.
    default: '120'
  background:
    description: original or festival.
    default: festival
  days:
    description: Number of UTC calendar days to fetch (1–366), including today by default.
    default: '365'
  end-date:
    description: Optional last UTC date (YYYY-MM-DD), today or earlier; defaults to today.
    required: false
  seed:
    description: Stable contribution-pattern seed.
    default: default
  auto-spacing:
    description: Automatically fit the closest tap pair without editing timing.
    default: 'true'
  speed:
    description: Manual scroll speed when auto-spacing is false.
    default: '190'
  note-gap:
    description: Pixel gap for automatic spacing.
    default: '0'
  fps:
    description: GIF only; frames per second. SVG animation follows browser rendering cadence.
    default: '30'
  colors:
    description: GIF only; palette colours.
    default: '96'
  publish:
    description: Publish the rendered file into the caller repository's output branch. Requires checkout and contents write permission.
    default: 'false'
  output-branch:
    description: Destination branch when publish is true.
    default: output
  output-name:
    description: Optional file path on the output branch; defaults to taiko.svg or taiko.gif.
    required: false

outputs:
  files:
    description: JSON array of absolute rendered file paths.
    value: ${{ steps.render.outputs.files }}
  file:
    description: Absolute path to the rendered file in the caller workspace.
    value: ${{ steps.render.outputs.file }}
  chart:
    description: Absolute path to the source or generated TJA.
    value: ${{ steps.render.outputs.chart }}
  metadata:
    description: Absolute metadata path, or empty for an ordinary custom TJA.
    value: ${{ steps.render.outputs.metadata }}
  snapshot:
    description: Snapshot path, or empty for custom TJA.
    value: ${{ steps.render.outputs.snapshot }}
  size-bytes:
    description: Rendered file size in bytes.
    value: ${{ steps.render.outputs.size-bytes }}
  duration-seconds:
    description: Chart duration in seconds.
    value: ${{ steps.render.outputs.duration-seconds }}
  published:
    description: true when a new output-branch commit was pushed.
    value: ${{ steps.render.outputs.published }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        # The downloaded Action lives outside the caller's GITHUB_WORKSPACE.
        # setup-python cache hashing cannot read its requirements there.
    - name: Install taiko-github-profile dependencies
      shell: bash
      env:
        TAIKO_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -r "$TAIKO_ACTION_PATH/requirements.txt"
    - name: Render Taiko
      id: render
      shell: bash
      env:
        TAIKO_ACTION_PATH: ${{ github.action_path }}
        TAIKO_USERNAME: ${{ inputs.username }}
        TAIKO_TOKEN: ${{ inputs.github-token }}
        TAIKO_CHART: ${{ inputs.chart }}
        TAIKO_SNAPSHOT: ${{ inputs.snapshot }}
        TAIKO_OUTPUTS: ${{ inputs.outputs }}
        TAIKO_VARIANT: ${{ inputs.variant }}
        TAIKO_OUTPUT: ${{ inputs.output }}
        TAIKO_FORMAT: ${{ inputs.format }}
        TAIKO_BPM: ${{ inputs.bpm }}
        TAIKO_BACKGROUND: ${{ inputs.background }}
        TAIKO_DAYS: ${{ inputs.days }}
        TAIKO_END_DATE: ${{ inputs.end-date }}
        TAIKO_SEED: ${{ inputs.seed }}
        TAIKO_AUTO_SPACING: ${{ inputs.auto-spacing }}
        TAIKO_SPEED: ${{ inputs.speed }}
        TAIKO_NOTE_GAP: ${{ inputs.note-gap }}
        TAIKO_FPS: ${{ inputs.fps }}
        TAIKO_COLORS: ${{ inputs.colors }}
        TAIKO_PUBLISH: ${{ inputs.publish }}
        TAIKO_OUTPUT_BRANCH: ${{ inputs.output-branch }}
        TAIKO_OUTPUT_NAME: ${{ inputs.output-name }}
      run: python "$TAIKO_ACTION_PATH/scripts/run_action.py"
