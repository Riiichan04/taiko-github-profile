# Copy this file to .github/workflows/taiko.yml in your PROFILE repository.
# Replace OWNER/taiko-github-profile with the separate repository hosting this project.
name: Update profile Taiko

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taiko-profile-output
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Generate Taiko
        id: taiko
        uses: OWNER/taiko-github-profile@main
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
          bpm: '200'
          outputs: |
            dist/taiko.svg?background=original
            dist/taiko-festival.svg?background=festival
      - name: Publish generated animations
        run: |
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add --detach ../taiko-output origin/output
          else
            git worktree add --detach ../taiko-output HEAD
            git -C ../taiko-output checkout --orphan taiko-output
            git -C ../taiko-output rm -rf .
          fi
          cp dist/taiko.svg dist/taiko-festival.svg ../taiko-output/
          cd ../taiko-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taiko.svg taiko-festival.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update Taiko animations"
            git push origin HEAD:output
          fi
